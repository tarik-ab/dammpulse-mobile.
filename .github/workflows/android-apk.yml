name: Build Android prototype APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Align Expo SDK native dependencies
        run: npx expo install --fix
      - name: Install Expo system UI module
        run: npx expo install expo-system-ui
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate clean native Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Diagnose Expo Android autolinking metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-autolinking.json
          node -e "const c=require('/tmp/expo-autolinking.json'); console.log(JSON.stringify((c.modules||[]).map((m,i)=>({index:i,name:m.name,projects:(m.projects||[]).map(p=>({name:p.name,publication:p.publication}))})),null,2))"
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dammpulse-360-prototype-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
